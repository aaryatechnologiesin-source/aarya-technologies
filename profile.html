<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <!-- Tailwind CSS CDN (Preserved Existing UI/Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Toastify CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">

    <!-- Global Fullscreen Loader (Preserved Existing UI/Animation/Layout) -->
    <div id="global-loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950/90 backdrop-blur-md transition-opacity duration-300">
        <div class="relative flex items-center justify-center">
            <div class="w-16 h-16 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin"></div>
            <div class="absolute text-emerald-400 font-mono text-xs tracking-widest uppercase">Loading</div>
        </div>
        <p class="mt-4 text-slate-400 text-sm font-medium tracking-wide animate-pulse">Initializing Profile...</p>
    </div>

    <!-- Header / Nav -->
    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold">
                    P
                </div>
                <span class="font-semibold text-slate-200 tracking-tight">User Portal</span>
            </div>
            <button id="logout-btn" class="flex items-center space-x-2 px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition-colors border border-transparent hover:border-slate-700">
                <i class="fa-solid fa-right-from-bracket text-xs"></i>
                <span>Logout</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden backdrop-blur-xl">
            
            <!-- Decorative Glow -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex flex-col sm:flex-row items-center sm:items-start space-y-6 sm:space-y-0 sm:space-x-6">
                <!-- Avatar Container -->
                <div class="relative group">
                    <div id="avatar-container" class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl bg-slate-800 border-2 border-slate-700 overflow-hidden flex items-center justify-center text-3xl font-bold text-emerald-400 shadow-inner">
                        <!-- Loaded dynamically or fallback to initial -->
                        <span id="avatar-initial">?</span>
                    </div>
                </div>

                <!-- User Meta Details -->
                <div class="flex-1 text-center sm:text-left space-y-2">
                    <div class="inline-flex items-center space-x-2 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span id="badge-status">Active Account</span>
                    </div>
                    <h1 id="user-display-name" class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Loading Name...</h1>
                    <p id="user-email" class="text-slate-400 text-sm font-mono">loading@domain.com</p>
                </div>
            </div>

            <!-- Divider -->
            <div class="my-8 border-t border-slate-800"></div>

            <!-- Additional Details Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-slate-950/40 border border-slate-800/60 rounded-xl p-4">
                    <span class="text-xs font-mono uppercase tracking-wider text-slate-500 block mb-1">Account UID</span>
                    <span id="user-uid" class="text-sm font-mono text-slate-300 break-all">---</span>
                </div>
                <div class="bg-slate-950/40 border border-slate-800/60 rounded-xl p-4">
                    <span class="text-xs font-mono uppercase tracking-wider text-slate-500 block mb-1">Email Verified</span>
                    <span id="email-verified-status" class="text-sm font-medium text-slate-300">---</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600 font-mono">
        Secure Portal &bull; All Rights Reserved
    </footer>

    <!-- Toastify JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- Firebase App & Services via Modular CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration (Replace with your secure project credentials if needed)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log("Firebase Initialized");

        // Helper Toast Function
        function showToast(message, type = "info") {
            let background = "#10b981"; // success emerald
            if (type === "error") background = "#ef4444"; // red
            if (type === "warning") background = "#f59e0b"; // amber

            Toastify({
                text: message,
                duration: 4000,
                close: true,
                gravity: "top",
                position: "right",
                style: {
                    background: background,
                    color: "#ffffff",
                    borderRadius: "12px",
                    fontSize: "13px",
                    fontFamily: "ui-sans-serif, system-ui, sans-serif",
                    boxShadow: "0 10px 15px -3px rgba(0, 0, 0, 0.3)"
                }
            }).showToast();
        }

        // Helper Loader Hider
        function hideLoader() {
            const loader = document.getElementById("global-loader");
            if (loader) {
                loader.style.opacity = "0";
                setTimeout(() => {
                    loader.style.display = "none";
                }, 300);
            }
            console.log("Loader Hidden");
        }

        // Safe Redirect Helper (prevents loops)
        function redirectToLogin() {
            if (!window.location.pathname.includes("login.html")) {
                window.location.replace("login.html");
            }
        }

        // Main Auth State Observer
        onAuthStateChanged(auth, async (user) => {
            try {
                if (!user) {
                    console.log("User Logged In: None / Unauthenticated");
                    showToast("Please log in to continue.", "warning");
                    redirectToLogin();
                    return;
                }

                console.log("User Logged In");

                // 4. Reload user before checking email verification
                await user.reload();
                const refreshedUser = auth.currentUser || user;

                // 5. If email is NOT verified, redirect to login
                if (!refreshedUser.emailVerified) {
                    showToast("Please verify your email address to access your profile.", "warning");
                    redirectToLogin();
                    return;
                }

                let profileData = {
                    displayName: refreshedUser.displayName || "User",
                    email: refreshedUser.email || "No Email",
                    photoURL: refreshedUser.photoURL || null,
                    uid: refreshedUser.uid
                };

                // 6. Load Firestore users/{uid}
                try {
                    const userDocRef = doc(db, "users", refreshedUser.uid);
                    const userDocSnap = await getDoc(userDocRef);

                    if (userDocSnap.exists()) {
                        const data = userDocSnap.data();
                        profileData = { ...profileData, ...data };
                        console.log("Firestore Loaded");
                    } else {
                        // Create it automatically using Firebase Authentication data
                        await setDoc(userDocRef, {
                            displayName: refreshedUser.displayName || "User",
                            email: refreshedUser.email,
                            photoURL: refreshedUser.photoURL || "",
                            createdAt: new Date().toISOString()
                        }, { merge: true });
                        console.log("Firestore Loaded: Document created automatically");
                    }
                } catch (firestoreError) {
                    console.error("Firestore Error:", firestoreError.code || firestoreError.message);
                    
                    // 7. Handle specific Firebase errors & show beautiful toast messages
                    const errCode = firestoreError.code || "";
                    if (errCode.includes("permission-denied") || errCode.includes("missing-or-insufficient-permissions")) {
                        showToast("Permission denied accessing user data. Loading fallback data.", "error");
                    } else if (errCode.includes("network-request-failed")) {
                        showToast("Network error connecting to database. Using offline session.", "warning");
                    } else {
                        showToast("Database error encountered. Loading standard session.", "error");
                    }
                    
                    // 8. If Firestore fails, still load profile using Firebase Authentication data (Never keep loader running forever)
                }

                console.log("Profile Loaded");

                // Render Profile to DOM (Preserving Existing UI Elements)
                document.getElementById("user-display-name").textContent = profileData.displayName || "User";
                document.getElementById("user-email").textContent = profileData.email || "No Email";
                document.getElementById("user-uid").textContent = profileData.uid || "---";
                
                const verifiedEl = document.getElementById("email-verified-status");
                verifiedEl.textContent = refreshedUser.emailVerified ? "Verified" : "Unverified";
                verifiedEl.className = refreshedUser.emailVerified ? "text-sm font-medium text-emerald-400" : "text-sm font-medium text-amber-400";

                // 9. If profile image missing, generate avatar using first letter of user name
                const avatarContainer = document.getElementById("avatar-container");
                if (profileData.photoURL && profileData.photoURL.trim() !== "") {
                    avatarContainer.innerHTML = `<img src="${profileData.photoURL}" alt="Profile Avatar" class="w-full h-full object-cover">`;
                } else {
                    const firstLetter = (profileData.displayName || profileData.email || "U").charAt(0).toUpperCase();
                    avatarContainer.innerHTML = `<span id="avatar-initial">${firstLetter}</span>`;
                }

                showToast("Profile loaded successfully!", "success");

            } catch (error) {
                console.error("Critical Profile Loading Error:", error);
                
                // 7. Handle all Firebase errors with toast messages
                const errCode = error.code || "";
                if (errCode.includes("unauthenticated")) {
                    showToast("Session expired. Please log in again.", "error");
                    redirectToLogin();
                } else if (errCode.includes("user-not-found")) {
                    showToast("User account not found.", "error");
                    redirectToLogin();
                } else {
                    showToast("An unexpected error occurred while loading your profile.", "error");
                }
            } finally {
                // 2. Use proper try/catch/finally structure. Loader MUST be hidden inside finally.
                // 12. NEVER leave the loader visible. No matter what happens, loader must disappear.
                hideLoader();
            }
        });

        // Logout Event Listener
        document.getElementById("logout-btn").addEventListener("click", async () => {
            try {
                await signOut(auth);
                showToast("Logged out successfully.", "success");
                redirectToLogin();
            } catch (err) {
                console.error("Logout Error:", err);
                showToast("Failed to log out cleanly.", "error");
            }
        });
    </script>
</body>
</html>
